<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300" role="img" aria-label="Referee approving">
  <defs>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
  </defs>

  <!-- raised left arm (viewer's left) with thumbs up -->
  <g>
    <!-- black sleeve -->
    <path d="M70 150 L44 96 q-4 -9 6 -13 l14 -5 q9 -3 12 6 l20 55 Z" fill="url(#shirt)"/>
    <!-- forearm skin -->
    <rect x="34" y="52" width="34" height="52" rx="16" transform="rotate(-16 51 78)" fill="#e9b489"/>
    <!-- fist -->
    <rect x="30" y="40" width="38" height="34" rx="14" fill="#eab88d"/>
    <!-- thumb up -->
    <rect x="30" y="14" width="17" height="34" rx="8" fill="#eab88d"/>
    <!-- knuckle lines -->
    <path d="M50 52 h15 M50 60 h15 M50 67 h15" stroke="#d29d69" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- torso / shirt -->
  <path d="M60 300 L60 168 q0 -26 26 -32 l6 -2 q28 16 56 0 l6 2 q26 6 26 32 L206 300 Z"
        transform="translate(-23 0)" fill="url(#shirt)"/>
  <!-- teal collar -->
  <path d="M92 136 L110 158 L128 136 q-18 10 -36 0 Z" fill="#6fa8b5"/>
  <!-- FIFA-style chest badge -->
  <rect x="120" y="150" width="26" height="20" rx="3" fill="#e9edf2"/>
  <rect x="120" y="150" width="26" height="7" rx="3" fill="#2f6fb0"/>

  <!-- neck -->
  <rect x="96" y="120" width="28" height="26" rx="10" fill="#d89e73"/>

  <!-- head (bald) -->
  <ellipse cx="110" cy="78" rx="42" ry="46" fill="#eab88d"/>
  <!-- ears -->
  <ellipse cx="69" cy="82" rx="8" ry="12" fill="#e3a878"/>
  <ellipse cx="151" cy="82" rx="8" ry="12" fill="#e3a878"/>
  <!-- bald sheen -->
  <ellipse cx="96" cy="52" rx="16" ry="9" fill="#f4cca4" opacity="0.7"/>

  <!-- eyebrows (raised, smug) -->
  <path d="M84 66 q9 -6 18 -1" stroke="#6b4a35" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M118 65 q9 -5 18 1" stroke="#6b4a35" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="94" cy="78" r="4.5" fill="#2b2320"/>
  <circle cx="127" cy="78" r="4.5" fill="#2b2320"/>
  <!-- nose -->
  <path d="M110 82 q5 8 -2 13" stroke="#c98f5f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- smug smirk -->
  <path d="M96 104 q16 10 32 -2" stroke="#7a3b2e" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- headset band + mic boom -->
  <path d="M70 74 q40 -46 80 0" stroke="#1b1b1e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M69 84 q-6 20 22 26" stroke="#1b1b1e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="92" cy="110" r="5" fill="#1b1b1e"/>

  <!-- whistle lanyard -->
  <path d="M128 140 q22 26 4 44" stroke="#b23b3b" stroke-width="4" fill="none"/>
  <rect x="126" y="182" width="18" height="12" rx="4" fill="#c9ccd1"/>
  <circle cx="141" cy="188" r="4" fill="#9aa0a6"/>
</svg>
